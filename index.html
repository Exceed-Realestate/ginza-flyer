<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>銀座セールスギャラリー チラシ B5 — 18枚 × 4レイアウト</title>
<style>
  @page { size: 182mm 257mm; margin: 0; }
  :root{
    --gold:#A5822F; --gold-l:#DCC189; --ink:#10131A; --ink-s:#3E434E;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --roman:"Didot","Bodoni 72","Baskerville",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#4E4E51;padding:26px;padding-top:110px;display:flex;flex-direction:column;
       align-items:center;gap:10px;font-family:var(--gothic);-webkit-font-smoothing:antialiased}

  /* ── ツールバー ── */
  .toolbar{position:fixed;top:0;left:0;right:0;z-index:100;background:#11141B;
    border-bottom:1px solid rgba(217,184,114,.35);padding:9px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
    box-shadow:0 2px 14px rgba(0,0,0,.45)}
  .tb-label{font-size:9.5px;letter-spacing:.2em;color:#D9B872;font-weight:700;
    text-transform:uppercase;white-space:nowrap}
  .toolbar select{background:#1B1F29;color:#fff;border:1px solid rgba(255,255,255,.22);
    border-radius:3px;padding:6px 26px 6px 10px;font-size:12px;font-family:var(--gothic);
    cursor:pointer;-webkit-appearance:none;appearance:none;max-width:280px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23D9B872'/></svg>");
    background-repeat:no-repeat;background-position:right 9px center}
  .tb-check{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#fff;cursor:pointer;white-space:nowrap}
  .tb-check input{accent-color:#D9B872;width:14px;height:14px;cursor:pointer}
  .tb-note{font-size:10px;color:rgba(255,255,255,.4);margin-left:auto;white-space:nowrap}
  @media print{.toolbar{display:none}body{padding:0}.cap{display:none}}

  .cap{color:#fff;font-size:12px;letter-spacing:.1em;margin-top:14px;font-weight:700}
  .cap span{font-weight:400;opacity:.55;letter-spacing:.02em}

  /* ── シート ── */
  .sheet{width:182mm;height:257mm;position:relative;overflow:hidden;background:#0B1430;
    box-shadow:0 14px 44px rgba(0,0,0,.5)}
  .sheet>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:50% 42%;display:block}
  .scrim{position:absolute;left:0;right:0;top:0;pointer-events:none}
  .band{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:14mm 12mm 6mm;color:#fff;
    text-shadow:0 1px 6px rgba(4,8,22,.85),0 0 18px rgba(4,8,22,.5)}

  .head{position:absolute;top:9mm;left:12mm;right:12mm;z-index:5;display:flex;
    justify-content:space-between;align-items:flex-start}
  .brandrow{display:flex;align-items:center;gap:3.2mm}
  .brandrow .mark{height:9mm;width:auto;display:block;flex:none}
  .brand{font-family:var(--roman);font-size:11.5pt;letter-spacing:.34em}
  .brand small{display:block;font-family:var(--gothic);font-size:5.6pt;
    letter-spacing:.2em;margin-top:1.1mm;opacity:.72}
  .open{text-align:right}
  .open .k{font-size:6.4pt;letter-spacing:.24em;color:var(--gold);font-weight:700;margin-bottom:1.1mm}
  .open .d{font-family:var(--roman);font-size:19pt;line-height:1;letter-spacing:.02em}
  .open .w{font-size:6pt;letter-spacing:.24em;margin-top:.9mm;opacity:.72}

  .lead{position:absolute;z-index:5}
  .lead .bar{width:15mm;height:.45mm;background:var(--gold);margin-bottom:4.2mm}
  .lead[data-align="right"] .bar{margin-left:auto}
  .lead[data-align="center"] .bar{margin:0 auto 4.2mm}
  h1{font-family:var(--mincho);font-weight:600;line-height:1.48;letter-spacing:.03em;
    font-feature-settings:"palt" 1}
  h1 em{font-style:normal;color:var(--gold)}
  .lead .sub{margin-top:3.4mm;font-size:8.4pt;line-height:1.8;letter-spacing:.07em}
  .band h1{color:#fff}
  .band h1 em{color:var(--gold-l)}

  .devs{display:flex;list-style:none;border-top:.3mm solid rgba(255,255,255,.34);
    border-bottom:.3mm solid rgba(255,255,255,.34)}
  .devs li{flex:1;text-align:center;padding:3mm 0;font-family:var(--roman);font-size:12pt;
    letter-spacing:.1em;display:flex;align-items:center;justify-content:center}
  .devs li+li{border-left:.3mm solid rgba(255,255,255,.24)}
  .devs li img{width:auto;object-fit:contain;display:block;margin:0 auto}
  .devs li img[alt="DAMAC"]{height:2.5mm;max-width:74%}
  .devs li img[alt="Ellington"]{height:8.6mm;max-width:74%}
  .devs li img[alt="Beyond"]{height:4.25mm;max-width:74%}
  .devs li img[alt="Amali"]{height:3.35mm;max-width:74%}

  .cols2{display:grid;grid-template-columns:42mm 1fr;gap:7mm;align-items:end}
  .cols2 .devs{flex-direction:column;border:0}
  .cols2 .devs li{border-left:0!important;border-bottom:.3mm solid rgba(255,255,255,.24);
    padding:2mm 0;justify-content:flex-start;min-height:7.5mm}
  .cols2 .devs li:first-child{border-top:.3mm solid rgba(255,255,255,.34)}
  .cols2 .devs li img{margin:0}
  .cols2 .devs li img[alt="DAMAC"]{height:2.1mm}
  .cols2 .devs li img[alt="Ellington"]{height:7.2mm}
  .cols2 .devs li img[alt="Beyond"]{height:3.55mm}
  .cols2 .devs li img[alt="Amali"]{height:2.8mm}

  .reason{margin-top:4mm;font-family:var(--mincho);font-size:8.6pt;line-height:1.8;
    letter-spacing:.04em;color:rgba(255,255,255,.92)}
  .reason b{font-weight:600;color:var(--gold-l)}
  .cta{margin-top:4.4mm;padding-top:4mm;border-top:.3mm solid rgba(220,193,137,.5);
    display:grid;grid-template-columns:1fr 19mm;gap:5.5mm;align-items:center}
  .cta h2{font-family:var(--mincho);font-size:11pt;font-weight:600;letter-spacing:.05em;margin-bottom:2.4mm}
  .cta h2 em{font-style:normal;color:var(--gold-l)}
  .cta table{border-collapse:collapse;font-size:7.4pt;line-height:1.9}
  .cta th{text-align:left;font-size:6.2pt;letter-spacing:.18em;color:rgba(220,193,137,.9);
    font-weight:700;padding-right:3.6mm;white-space:nowrap;vertical-align:top}
  .fill{background:rgba(255,255,255,.14);border-bottom:.3mm dashed rgba(220,193,137,.8);
    padding:0 1.7mm;color:#F2DDB0}
  .qr{text-align:center;align-self:center}
  .qr img{width:100%;display:block}
  .qr span{display:block;margin-top:1.6mm;font-size:5.4pt;letter-spacing:.14em;color:rgba(255,255,255,.86)}
  .legal{margin-top:4mm;font-size:4.9pt;line-height:1.6;color:rgba(255,255,255,.52)}
  .legal u{text-decoration:none;border-bottom:.3mm dashed #E08A6E}
  .tag{position:absolute;top:0;left:0;background:#A9452F;color:#fff;z-index:9;
    font-size:6.4pt;font-weight:700;padding:1.6px 7px;letter-spacing:.1em}
  .note{color:rgba(255,255,255,.5);font-size:11px;max-width:182mm;text-align:center;line-height:1.6}
</style>
</head>

  const pos = inBand ? '' :
    `top:${h.t}mm;${h.l!=null?`left:${h.l}mm;`:''}${h.r!=null?`right:${h.r}mm;`:''}` +
    `${h.w?`width:${h.w}mm;`:(h.l!=null&&h.r!=null?'':'')}${h.l!=null&&h.r!=null&&!h.w?`right:${h.r}mm;`:''}` +
    `text-align:${h.align||'left'};color:${textColor};`;

  const headBlock = `
    <div class="lead" data-align="${h.align||'left'}" style="${pos}">
      <div class="bar"></div>
      <h1 style="font-size:${size}pt;${shadow}">${hd.h}</h1>
      <p class="sub" style="color:${subColor};${shadow}">${sub.t}</p>
    </div>`;

  const bandHead = inBand ? `
    <div class="bar"></div>
    <h1 style="font-size:${Math.min(hd.size,20)}pt;margin-bottom:1mm">${hd.h}</h1>
    <p class="sub" style="color:rgba(255,255,255,.84);margin-bottom:5mm">${sub.t}</p>` : '';

  const body = `
    <p class="reason">${lead.t}</p>
    <div class="cta">
      <div>
        <h2><em>LINE公式アカウント</em>、開設しました。</h2>
        <table>
          <tr><th>会 場</th><td>${ADDR}</td></tr>
          <tr><th>開 業</th><td>2026年10月18日（日）　友だち追加で、開業のご案内とドバイ最新物件の情報をお届けします。</td></tr>
        </table>
      </div>
      <div class="qr"><img src="assets/line-qr-white.png" alt="LINE QR"><span>友だち追加</span></div>
    </div>`;

  const bandInner = lay.band.cols===2
    ? `${bandHead}<div class="cols2"><div>${devList()}</div><div>${body}</div></div>`
    : `${bandHead}${devList()}${body}`;

  const markStyle = S.mark ? '' : 'display:none;';
  const headColor = col==='ink' && !inBand ? 'var(--ink)' : (h.t!=null&&h.t<20?'#fff':'var(--ink)');

  return `
  <section class="sheet">
    <div class="tag">${img.name.split(' ／')[0]}｜レイアウト${lay.id}</div>
    <img src="${img.file}" alt="${img.name}">
    ${scrim}
    <div class="band" style="padding-top:${Math.round((lay.band.h-30)*0.62)}mm;background:${grad(fade.rgb)}">${bandInner}
      <p class="legal">${LEGAL}</p>
    </div>
    <div class="head" style="color:${headColor}">
      <div class="brandrow">
        <img class="mark" src="assets/logos/exceed-mark-${headColor==='#fff'?'white':'ink'}.png" alt="EXCEED" style="${markStyle}">
        <div class="brand">EXCEED<small>REAL ESTATE ／ DUBAI</small></div>
      </div>
      <div class="open"><div class="k">日本初・銀座</div><div class="d">10.18</div><div class="w">2026 SUN OPEN</div></div>
    </div>
    ${inBand ? '' : headBlock}
  </section>`;
}

function render(){
  const img = HEROES.find(x=>x.id===S.image)||HEROES[0];
  const stage = document.getElementById('stage');
  const lays = S.layout==='all' ? img.layouts : img.layouts.filter(l=>l.id===S.layout);
  stage.innerHTML = `<div class="note">${img.note}</div>` +
    lays.map(l=>`<div class="cap">レイアウト ${l.id} ／ <span>${l.name.split(' ／ ')[1]||''}</span></div>${sheetHTML(img,l)}`).join('');
}

(function init(){
  Object.assign(S, {image:HEROES[0].id, layout:'all', headline:'2', sub:'a', lead:'a',
                    fade:'navy', logos:false, mark:true}, load());
  const iS=document.getElementById('img-select'),
        lS=document.getElementById('layout-select'),
        hS=document.getElementById('headline-select'),
        sS=document.getElementById('sub-select'),
        dS=document.getElementById('lead-select'),
        fS=document.getElementById('fade-select'),
        lg=document.getElementById('logo-toggle'),
        mk=document.getElementById('mark-toggle');

  fill(iS,HEROES,'id','name'); fill(hS,HEADLINES); fill(sS,SUBS); fill(dS,LEADS); fill(fS,FADES);

  function syncLayouts(){
    const img = HEROES.find(x=>x.id===S.image)||HEROES[0];
    lS.innerHTML='';
    const all=document.createElement('option'); all.value='all'; all.textContent='すべて表示 ／ 4案';
    lS.appendChild(all);
    img.layouts.forEach(l=>{const o=document.createElement('option');
      o.value=l.id;o.textContent=`${l.id} ／ ${l.name.split(' ／ ')[0]}`;lS.appendChild(o);});
    if(!['all',...img.layouts.map(l=>l.id)].includes(S.layout)) S.layout='all';
    lS.value=S.layout;
  }

  iS.value=S.image; syncLayouts();
  hS.value=S.headline; sS.value=S.sub; dS.value=S.lead; fS.value=S.fade;
  lg.checked=S.logos; mk.checked=S.mark;

  iS.onchange=e=>{S.image=e.target.value; syncLayouts(); save(); render();};
  lS.onchange=e=>{S.layout=e.target.value; save(); render();};
  hS.onchange=e=>{S.headline=e.target.value; save(); render();};
  sS.onchange=e=>{S.sub=e.target.value; save(); render();};
  dS.onchange=e=>{S.lead=e.target.value; save(); render();};
  fS.onchange=e=>{S.fade=e.target.value; save(); render();};
  lg.onchange=e=>{S.logos=e.target.checked; save(); render();};
  mk.onchange=e=>{S.mark=e.target.checked; save(); render();};

  render();
})();
</script>
</body>
</html>
